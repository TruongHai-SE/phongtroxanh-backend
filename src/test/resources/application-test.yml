    secret: 4c6f6e675f616e645f73757065725f7365637265745f6a77745f6b65795f666f725f70686f6e6774726f78616e685f766e5f68733531325f73656375726974795f746f6b656e
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  storage:
    upload-dir: target/test-uploads
