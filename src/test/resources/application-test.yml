spring:
  application:
    name: phongtroxanh-backend-test
  datasource:
    url: jdbc:postgresql://localhost:5433/phongtroxanh_db?stringtype=unspecified
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
