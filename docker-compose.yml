services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: phongtroxanh-postgres:16-postgis
    container_name: phongtroxanh-postgres
    restart: always
    environment:
      POSTGRES_DB: phongtroxanh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phongtroxanh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    image: phongtroxanh-redis:7
    container_name: phongtroxanh-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
